# Kestrel Pay teams, people, ownership and on-call. Format: examples/org.yaml.
# Every service in topology.yaml is owned by exactly one team. On-call handles must be members
# of that team; engineering managers are not in the rotation.
#
# Planted pattern 2 (bus factor): ines is the only person who commits to ledger-svc. The rest
# of the ledger team works on payouts-svc, reconciliation-job and ledger-db.
teams:
  - slug: platform
    name: Platform
    slack_channel: "#platform"
    owns: [edge, api-gateway, redis-cache, kafka, kafka-controller, schema-registry, object-store]
  - slug: checkout
    name: Checkout
    slack_channel: "#checkout"
    owns: [checkout-api, inventory-svc, inventory-db, pricing-svc]
  - slug: payments
    name: Payments
    slack_channel: "#payments"
    owns: [payments-svc, payments-db, acquirer-gateway]
  - slug: ledger
    name: Ledger
    slack_channel: "#ledger"
    owns: [ledger-svc, ledger-db, payouts-svc, reconciliation-job]
  - slug: risk
    name: Risk & Identity
    slack_channel: "#risk"
    owns: [fraud-svc, auth-svc]
  - slug: merchant
    name: Merchant Experience
    slack_channel: "#merchant-exp"
    owns: [user-api, user-db, search-api, search-index, webhooks-svc, notifications-svc]

