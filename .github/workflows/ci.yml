name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend + Kestrel Pay (lint + pytest on FalkorDB)
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Same tag as docker-compose.yml
        image: falkordb/falkordb:6.0.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      PAGERSAGE_REQUIRE_DB: "1" # DB tests fail instead of skipping
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed # embedding model (G04)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-all-MiniLM-L6-v2
      - run: uv run ruff check . ../kestrel-pay ../scripts
      - run: uv run ruff format --check . ../kestrel-pay ../scripts
      - run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
